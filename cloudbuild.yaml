# Google Cloud Build CI/CD Pipeline for FortressFleet
steps:
  # 1. Build the Docker container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/fortress-fleet:$COMMIT_SHA', '.']

  # 2. Push image to Google Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/fortress-fleet:$COMMIT_SHA']

  # 3. Deploy to Google Cloud Run with Scale-to-Zero configuration
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'fortress-fleet'
      - '--image'
      - 'gcr.io/$PROJECT_ID/fortress-fleet:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '3'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      - '--port'
      - '8080'

images:
  - 'gcr.io/$PROJECT_ID/fortress-fleet:$COMMIT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY
